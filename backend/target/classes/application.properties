server.port=8080
spring.application.name=attendance-tracker

# JSON file storage locations (DSA-based, NO database)
app.data.dir=./data
app.data.students=./data/students.json
app.data.teachers=./data/teachers.json
app.data.admins=./data/admins.json
app.data.attendance=./data/attendance.json
app.data.subjects=./data/subjects.json

# JWT
app.jwt.secret=ChangeThisSuperSecretKeyForAttendanceTrackerJWTAuth2026MustBe256Bits
app.jwt.expiration-ms=86400000

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.attendance.tracker=INFO
